<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Para Mari ♡</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    overflow: hidden;

    background: #fff7f8;

    font-family:
        "Comic Sans MS",
        "Segoe Print",
        cursive;

    color: #d94f70;
}


/* -------------------------
   FONDO LLENO DE TE AMO
------------------------- */

.background {
    position: fixed;
    inset: 0;
    overflow: hidden;
    pointer-events: none;
}

.love {
    position: absolute;

    font-size: 20px;

    opacity: 0.35;

    white-space: nowrap;

    animation:
        float 6s ease-in-out infinite;
}


/* posiciones */

.love:nth-child(1)  { top: 5%;  left: 5%;  transform: rotate(-12deg); }
.love:nth-child(2)  { top: 12%; left: 25%; transform: rotate(8deg); }
.love:nth-child(3)  { top: 8%;  right: 8%; transform: rotate(-5deg); }
.love:nth-child(4)  { top: 22%; left: 3%; transform: rotate(14deg); }
.love:nth-child(5)  { top: 28%; right: 5%; transform: rotate(-10deg); }
.love:nth-child(6)  { top: 38%; left: 8%; transform: rotate(6deg); }
.love:nth-child(7)  { top: 45%; right: 8%; transform: rotate(-8deg); }
.love:nth-child(8)  { top: 55%; left: 3%; transform: rotate(12deg); }
.love:nth-child(9)  { top: 62%; right: 4%; transform: rotate(-15deg); }
.love:nth-child(10) { top: 72%; left: 7%; transform: rotate(-6deg); }
.love:nth-child(11) { top: 78%; right: 10%; transform: rotate(10deg); }
.love:nth-child(12) { top: 88%; left: 20%; transform: rotate(-8deg); }
.love:nth-child(13) { top: 90%; right: 25%; transform: rotate(7deg); }
.love:nth-child(14) { top: 35%; left: 25%; transform: rotate(-4deg); }
.love:nth-child(15) { top: 68%; right: 28%; transform: rotate(5deg); }

.love.big {
    font-size: 28px;
    opacity: 0.45;
}

.love.tiny {
    font-size: 15px;
    opacity: 0.25;
}

@keyframes float {

    0%, 100% {
        translate: 0 0;
    }

    50% {
        translate: 0 -8px;
    }
}


/* -------------------------
   CONTENIDO CENTRAL
------------------------- */

.center {

    position: relative;

    min-height: 100vh;

    display: flex;

    flex-direction: column;

    justify-content: center;

    align-items: center;

    text-align: center;

    padding: 25px;

}


h1 {

    margin: 0;

    font-size: clamp(55px, 12vw, 110px);

    line-height: 1;

    font-weight: normal;

    animation: heartbeat 2s infinite;

}


.subtitle {

    margin-top: 25px;

    font-size: clamp(24px, 5vw, 42px);

}


.question {

    margin-top: 35px;

    font-size: clamp(18px, 3vw, 25px);

    color: #555;

}


.answer {

    margin-top: 12px;

    font-size: clamp(30px, 6vw, 55px);

    font-weight: bold;

}


/* -------------------------
   CORAZON
------------------------- */

.heart {

    margin-top: 25px;

    font-size: 65px;

    animation: heartbeat 1.5s infinite;

}


@keyframes heartbeat {

    0%, 100% {
        transform: scale(1);
    }

    50% {
        transform: scale(1.12);
    }

}


/* -------------------------
   BOTON
------------------------- */

button {

    margin-top: 35px;

    border: none;

    background: #d94f70;

    color: white;

    padding: 13px 25px;

    border-radius: 30px;

    font-family: inherit;

    font-size: 18px;

    cursor: pointer;

    box-shadow:
        0 5px 15px rgba(217,79,112,.25);

    transition: .2s;

}


button:hover {

    transform: scale(1.06);

}


/* -------------------------
   MENSAJES QUE APARECEN
------------------------- */

.popup {

    position: fixed;

    pointer-events: none;

    font-size: 30px;

    font-weight: bold;

    animation: popup 2s forwards;

}


@keyframes popup {

    0% {
        opacity: 0;
        transform: scale(.4);
    }

    20% {
        opacity: 1;
        transform: scale(1.1);
    }

    100% {
        opacity: 0;
        transform:
            translateY(-120px)
            scale(1);
    }

}

</style>
</head>


<body>


<!-- MUCHOS TE AMO -->

<div class="background">

    <div class="love big">te amo ♡</div>
    <div class="love">sí te amo</div>
    <div class="love tiny">te amo</div>
    <div class="love">te amo muchísimo ♡</div>
    <div class="love big">SÍ, TE AMO</div>
    <div class="love tiny">te amo</div>
    <div class="love">te amo ♡</div>
    <div class="love big">te amo</div>
    <div class="love tiny">sí te amo</div>
    <div class="love">te amo, Mari ♡</div>
    <div class="love big">te amo</div>
    <div class="love">sí te amo ♡</div>
    <div class="love tiny">te amo</div>
    <div class="love">te amo muchísimo</div>
    <div class="love big">TE AMO ♡</div>

</div>


<!-- CENTRO -->

<div class="center">

    <h1>
        Te amo ♡
    </h1>


    <div class="subtitle">
        sí, te amo
    </div>


    <div class="question">
        ¿Cuánto?
    </div>


    <div class="answer">
        Muchísimo.
    </div>


    <div class="heart">
        ❤️
    </div>


    <button onclick="loveExplosion()">
        ¿otra vez?
    </button>

</div>


<script>

function loveExplosion() {

    for (let i = 0; i < 12; i++) {

        const text = document.createElement("div");

        text.className = "popup";

        text.innerText =
            Math.random() > 0.5
            ? "TE AMO ♡"
            : "SÍ, TE AMO";

        text.style.left =
            Math.random() * 90 + "vw";

        text.style.top =
            Math.random() * 90 + "vh";

        text.style.color =
            "#d94f70";

        document.body.appendChild(text);

        setTimeout(() => {
            text.remove();
        }, 2000);

    }

}

</script>


</body>
</html>
